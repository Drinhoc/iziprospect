{% extends "base.html" %}
{% block title %}Conversa{% endblock %}

{% block content %}
<div class="conversa-layout">

  <!-- Coluna esquerda: thread de mensagens -->
  <div class="conversa-main">
    <!-- Header da conversa -->
    <div class="conversa-header" id="conversa-header">
      <a href="/inbox" class="conversa-back">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
        Inbox
      </a>
      <div class="conversa-header-info">
        <div class="conversa-nome" id="conv-nome">Carregando…</div>
        <div class="conversa-meta">
          <span id="conv-numero"></span>
          <span class="conversa-dot">·</span>
          <span id="conv-ultima-msg"></span>
        </div>
      </div>
      <div class="conversa-header-actions">
        <button class="btn-conv-action btn-conv-resolver" id="btn-resolver" onclick="resolverConversa()" title="Marcar como resolvida">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="20 6 9 17 4 12"/></svg>
          Resolver
        </button>
        <button class="btn-conv-action btn-conv-arquivar" id="btn-arquivar" onclick="arquivarConversa()" title="Arquivar">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="21 8 21 21 3 21 3 8"/><rect x="1" y="3" width="22" height="5"/><line x1="10" y1="12" x2="14" y2="12"/></svg>
        </button>
        <button class="btn-conv-action btn-conv-reabrir hidden" id="btn-reabrir" onclick="reabrirConversa()" title="Reabrir conversa">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 .49-3.35"/></svg>
          Reabrir
        </button>
      </div>
    </div>

    <!-- Mensagens -->
    <div class="conversa-thread" id="conversa-thread">
      <div class="conversa-thread-loading">
        <div class="spinner"></div>
      </div>
    </div>

    <!-- Caixa de resposta -->
    <div class="conversa-reply-box" id="reply-box">
      <div class="reply-suggestion hidden" id="reply-suggestion">
        <div class="reply-suggestion-label">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="13" height="13"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
          Sugestão da IA
        </div>
        <div class="reply-suggestion-text" id="reply-suggestion-text"></div>
        <button class="reply-suggestion-use" onclick="useSuggestion()">Usar sugestão</button>
      </div>
      <div class="reply-input-row">
        <textarea
          class="reply-textarea"
          id="reply-text"
          placeholder="Digite sua resposta…"
          rows="2"
          onkeydown="handleReplyKey(event)"
        ></textarea>
        <button class="reply-send-btn" id="reply-send-btn" onclick="sendReply()" title="Enviar (Ctrl+Enter)">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
        </button>
      </div>
    </div>
  </div>

  <!-- Coluna direita: painel de IA + detalhes -->
  <aside class="conversa-sidebar">
    <!-- Badges de status -->
    <div class="conv-badges" id="conv-badges"></div>

    <!-- Resumo IA -->
    <div class="conv-panel">
      <div class="conv-panel-header">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>
        Análise da IA
      </div>
      <div class="conv-panel-body" id="conv-resumo-ia">
        <span class="text-muted">Aguardando análise…</span>
      </div>
      <div class="conv-confianca" id="conv-confianca"></div>
      <button class="btn-reanalisar" onclick="reanalisarConversa()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 .49-3.35"/></svg>
        Re-analisar
      </button>
    </div>

    <!-- Editar categoria/prioridade -->
    <div class="conv-panel">
      <div class="conv-panel-header">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg>
        Classificação
      </div>
      <div class="conv-panel-body">
        <label class="conv-field-label">Categoria</label>
        <select class="conv-select" id="conv-categoria" onchange="updateField('categoria', this.value)">
          <option value="suporte">Suporte</option>
          <option value="vendas">Vendas</option>
          <option value="financeiro">Financeiro</option>
          <option value="informacao">Informação</option>
          <option value="spam">Spam</option>
          <option value="outro">Outro</option>
        </select>
        <label class="conv-field-label" style="margin-top:8px">Prioridade</label>
        <select class="conv-select" id="conv-prioridade" onchange="updateField('prioridade', this.value)">
          <option value="urgente">Urgente</option>
          <option value="alta">Alta</option>
          <option value="normal">Normal</option>
          <option value="baixa">Baixa</option>
        </select>
      </div>
    </div>

    <!-- Lead vinculado -->
    <div class="conv-panel">
      <div class="conv-panel-header">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/></svg>
        Lead CRM
      </div>
      <div class="conv-panel-body" id="conv-lead-info">
        <span class="text-muted">Nenhum lead vinculado</span>
      </div>
    </div>
  </aside>
</div>
{% endblock %}

{% block scripts %}
<script>
  const CONVERSA_ID = {{ conversa_id }};
</script>
<script src="/static/conversa.js"></script>
{% endblock %}
