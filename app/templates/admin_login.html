<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login — IziDesk Admin</title>
  <link rel="stylesheet" href="/static/style.css" />
  <style>
    body { display:flex; align-items:center; justify-content:center; min-height:100vh; background:var(--bg,#f9fafb); }
    .login-box {
      background:var(--bg-card,#fff); border:1px solid var(--border,#e5e7eb);
      border-radius:16px; padding:36px; width:360px; text-align:center;
    }
    .login-logo { font-size:22px; font-weight:800; margin-bottom:4px; }
    .login-sub { font-size:12px; color:#6b7280; margin-bottom:28px; }
    .login-input {
      width:100%; padding:10px 12px; border:1px solid var(--border,#e5e7eb);
      border-radius:8px; font-size:14px; background:var(--bg-input,#fff);
      color:var(--text,#111827); box-sizing:border-box; margin-bottom:12px;
    }
    .login-btn {
      width:100%; padding:11px; background:#1a56db; color:#fff; border:none;
      border-radius:8px; font-size:14px; font-weight:600; cursor:pointer;
    }
    .login-btn:hover { background:#1e40af; }
    .login-error { background:#fee2e2; color:#991b1b; border-radius:7px; padding:9px 12px; font-size:13px; margin-bottom:12px; }
  </style>
</head>
<body>
  <div class="login-box">
    <div class="login-logo">⚡ IziDesk</div>
    <div class="login-sub">Painel Administrativo</div>
    {% if erro %}
    <div class="login-error">{{ erro }}</div>
    {% endif %}
    <form method="POST" action="/admin/login">
      <input class="login-input" type="password" name="token" placeholder="Token de acesso" required autofocus />
      <button class="login-btn" type="submit">Entrar</button>
    </form>
  </div>
</body>
</html>
